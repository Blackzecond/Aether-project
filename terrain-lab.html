<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#172321" />
  <title>Aether · Terrain Foundation Lab</title>
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    .lab-shell{width:min(1100px,calc(100% - 28px));margin:auto;padding:18px 0 30px}
    .lab-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0 16px;border-bottom:1px solid var(--line)}
    .lab-head a{color:#c4d9c7;text-decoration:none;font-size:12px}
    .lab-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;margin-top:16px}
    .lab-panel{min-width:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(32,46,42,.9)}
    .lab-canvas{height:min(66vh,650px);min-height:320px;background:#101b19}
    .lab-canvas canvas{width:100%;height:100%;display:block;touch-action:pan-y}
    .lab-controls{padding:14px}
    .lab-controls h2{font-size:15px;margin:0 0 12px}
    .lab-controls label{display:flex;justify-content:space-between;gap:8px;margin:13px 0 5px;font-size:11px;color:#d2ddd4}
    .lab-controls output{color:#b9d3bd;font-variant-numeric:tabular-nums}
    .lab-controls input{width:100%;accent-color:#b5d0b9}
    .lab-controls select{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:#17231f;color:#e8eee9;padding:0 8px}
    .lab-meta{display:flex;flex-wrap:wrap;gap:7px;padding:10px 12px;border-top:1px solid var(--line);color:#9daf9f;font-size:10px}
    .lab-chip{padding:5px 7px;border:1px solid var(--line);border-radius:7px}
    .lab-actions{display:flex;gap:8px;margin-top:15px}
    .lab-actions button{flex:1}
    .lab-note{padding:12px;color:#9daf9f;font-size:10px;line-height:1.6}
    @media(max-width:760px){.lab-layout{grid-template-columns:1fr}.lab-canvas{height:52vh;min-height:290px}.lab-shell{width:calc(100% - 20px)}}
  </style>
</head>
<body>
  <main class="lab-shell">
    <header class="lab-head"><div><p class="eyebrow">AETHER · WORLD FOUNDATION V2</p><h1 style="font-size:23px;margin:5px 0 0">Terrain Lab</h1></div><a href="/">← กลับหน้าหลัก</a></header>
    <div class="lab-layout">
      <section class="lab-panel">
        <div class="panel-heading"><span><span class="status-dot"></span>พื้นผิวภูมิประเทศ · WebGL2</span><span id="lab-status">กำลังสร้างโลก</span></div>
        <div class="lab-canvas"><canvas id="terrain-canvas" aria-label="ตัวอย่างพื้นผิวภูเขาแบบสามมิติ"></canvas></div>
        <div class="lab-meta" id="lab-metrics"></div>
        <p class="lab-note">นี่คือพื้นผิว Heightfield จริงที่สร้างเป็น Mesh มี Depth Buffer และ Normal ต่อ Vertex ยังไม่มีแม่น้ำหรือต้นไม้ เพื่อให้ตรวจสอบรูปทรงภูเขาได้โดยไม่ถูกรบกวน</p>
      </section>
      <aside class="lab-panel lab-controls">
        <h2>รูปทรงภูเขา</h2>
        <label for="spacing">ระยะห่างแนวภูเขา <output id="spacing-value"></output></label><input id="spacing" type="range" min=".2" max="2.5" step=".01" value=".72">
        <label for="relief">ความสูงโดยรวม <output id="relief-value"></output></label><input id="relief" type="range" min=".05" max="1.5" step=".01" value=".72">
        <label for="sharpness">ยอดมน ↔ ยอดแหลม <output id="sharpness-value"></output></label><input id="sharpness" type="range" min="0" max="1" step=".01" value=".58">
        <label for="irregularity">ความคดเคี้ยวของสันเขา <output id="irregularity-value"></output></label><input id="irregularity" type="range" min="0" max="1" step=".01" value=".32">
        <label for="roughness">ความขรุขระ <output id="roughness-value"></output></label><input id="roughness" type="range" min="0" max=".6" step=".01" value=".16">
        <label for="detail-scale">ขนาดรายละเอียด <output id="detail-scale-value"></output></label><input id="detail-scale" type="range" min="1" max="16" step=".1" value="5.5">
        <label for="octaves">จำนวนชั้นรายละเอียด <output id="octaves-value"></output></label><input id="octaves" type="range" min="1" max="7" step="1" value="4">
        <label for="debug-mode">มุมมองตรวจสอบ</label><select id="debug-mode">
          <option value="shaded">พื้นผิวและแสง</option><option value="elevation">ระดับความสูง</option><option value="slope">ความลาดชัน</option><option value="normals">ทิศทางพื้นผิว</option><option value="wireframe">โครงตาข่าย</option>
        </select>
        <div class="lab-actions"><button id="new-seed" class="quiet-button">สุ่ม Seed</button><button id="reset-terrain" class="quiet-button">คืนค่า</button></div>
        <label for="seed">Seed <output id="seed-value"></output></label><input id="seed" type="range" min="1" max="99999" step="1" value="18273">
      </aside>
    </div>
  </main>
  <script type="module" src="/src/terrain-lab.ts"></script>
</body>
</html>
